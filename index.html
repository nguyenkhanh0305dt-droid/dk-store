<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

<!-- HEADER -->
<header class="bg-black text-white flex justify-between items-center px-8 py-4 shadow">
  <h1 class="text-2xl font-bold">DK Store</h1>
  <nav class="space-x-6">
    <a href="#" class="hover:text-gray-400">Trang chủ</a>
    <a href="#" class="hover:text-gray-400">Sản phẩm</a>
    <a href="#" class="hover:text-gray-400">Liên hệ</a>
  </nav>
</header>

<!-- HERO -->
<section class="bg-gradient-to-r from-black to-gray-800 text-white px-10 py-16 flex flex-col md:flex-row items-center justify-between">
  <div>
    <h2 class="text-4xl font-bold mb-4">Chào mừng đến DK Store</h2>
    <p class="mb-4">Giày thể thao chính hãng - Giá tốt - Xu hướng 2026</p>
    <button class="bg-blue-500 hover:bg-blue-600 px-6 py-2 rounded-xl">Mua ngay</button>
  </div>
  <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" class="w-80 rounded-xl shadow-lg mt-6 md:mt-0">
</section>

<!-- PRODUCTS -->
<section class="px-10 py-10">
  <h2 class="text-3xl font-bold mb-6 text-center">Sản phẩm nổi bật</h2>

  <div class="grid md:grid-cols-3 gap-8">

    <div class="bg-white p-4 rounded-2xl shadow hover:scale-105 transition">
      <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519" class="rounded-xl">
      <h3 class="font-bold mt-3">Nike Air Max</h3>
      <p class="text-red-500">2.500.000đ</p>
      <button class="bg-black text-white w-full mt-2 py-2 rounded">Mua</button>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow hover:scale-105 transition">
      <img src="https://images.unsplash.com/photo-1582582429416-85c8f76c9f9f" class="rounded-xl">
      <h3 class="font-bold mt-3">Adidas Ultra Boost</h3>
      <p class="text-red-500">3.000.000đ</p>
      <button class="bg-black text-white w-full mt-2 py-2 rounded">Mua</button>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow hover:scale-105 transition">
      <img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db" class="rounded-xl">
      <h3 class="font-bold mt-3">Puma RS-X</h3>
      <p class="text-red-500">2.200.000đ</p>
      <button class="bg-black text-white w-full mt-2 py-2 rounded">Mua</button>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="bg-black text-white text-center py-6 mt-10">
  <p>© 2026 DK Store | Liên hệ: dkstore@gmail.com</p>
</footer>

</body>
</html>
